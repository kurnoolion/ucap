[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucap"
version = "0.1.0"
description = "Toolkit for UE capability analysis: parse, diff, audit against compliance, and more"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ucap maintainers" }]
dependencies = [
    "pydantic>=2.6",
    "pycrate>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ucap = "ucap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ucap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
